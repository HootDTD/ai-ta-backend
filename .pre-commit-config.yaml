# Pre-commit hooks — same ruff config as CI, so local == CI.
# pre-commit runs only on STAGED files, which naturally matches CI's
# changed-files-only ruff gate (new code stays clean; legacy untouched).
#
# Install once:  pip install pre-commit && pre-commit install
# Run on all:    pre-commit run --all-files   (expect legacy noise — that's fine)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16 # keep in sync with requirements-test.txt ruff pin
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key # cheap secret tripwire

  # Architecture-doc ownership lint — keeps local == CI (PLAN §6.4). Fires when a
  # commit touches Python or the durable architecture tree. ADVISORY during the
  # docs/granular-restructure split (--exit-zero mirrors CI's continue-on-error so
  # a mid-flight bijection storm never blocks a commit). W5 removes --exit-zero to
  # make it blocking, in lockstep with flipping the CI `docs` job to required.
  - repo: local
    hooks:
      - id: docs-owns-coverage
        name: architecture-doc ownership bijection lint (advisory)
        entry: python scripts/docs/check_owns_coverage.py --check-size --exit-zero
        language: system
        pass_filenames: false
        files: '(\.py$|^docs/architecture/.*\.md$)'
